name: Sports Cards weekly price refresh

on:
  schedule:
    # Every Sunday at 22:00 UTC (Sunday 6pm ET / 3pm PT)
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Refresh eBay sold comps
        env:
          EBAY_OAUTH_TOKEN: ${{ secrets.EBAY_OAUTH_TOKEN }}
        run: python live_prices.py
      - name: Commit refreshed prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "data: weekly eBay sold-comp refresh"
            git push
          fi
